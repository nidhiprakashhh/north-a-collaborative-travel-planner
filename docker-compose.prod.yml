# Production stack: nginx is the only container exposed to the internet
# (ports 80/443). Everything else — api, postgres, mongodb, redis — only
# talks over the internal compose network, with no host ports published.
#
# Usage (see deploy/deploy.sh for the full flow):
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# `name:` is set explicitly (rather than left to default to the directory
# name) because that default is IDENTICAL to the dev docker-compose.yml's
# project name — without this, running both from the same checkout resolves
# to the same Compose project, so prod would silently reuse dev's containers,
# network, and (worse) named volumes, e.g. booting the api against a 3-week-
# old dev Postgres volume instead of a fresh prod one.
name: north-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: north-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  mongodb:
    image: mongo:7
    container_name: north-prod-mongodb
    restart: always
    command: ["--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "${MONGO_ROOT_USERNAME}",
          "-p",
          "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  redis:
    image: redis:7-alpine
    container_name: north-prod-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 128m

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    container_name: north-prod-api
    restart: always
    env_file:
      - .env.production
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 384m

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: north-prod-worker
    restart: always
    env_file:
      - .env.production
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 64m

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: north-prod-nginx
    restart: always
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m

  # Renews the cert twice a day (certbot no-ops unless it's within 30 days of
  # expiry); nginx doesn't auto-pick-up renewed certs, so `deploy/deploy.sh`
  # or a cron entry should periodically `docker compose exec nginx nginx -s reload`.
  certbot:
    image: certbot/certbot
    container_name: north-prod-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"

volumes:
  pgdata:
  mongodata:
  certbot-etc:
  certbot-var:
  certbot-webroot:
