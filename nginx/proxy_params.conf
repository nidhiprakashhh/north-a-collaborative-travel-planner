proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
# proxy_read_timeout deliberately omitted here (nginx's built-in default is
# 60s, fine for regular requests) — the /socket.io/ location overrides it
# to 3600s itself, and can't both include this file and set it again if this
# file also sets it (nginx treats a repeated directive as a hard error, not
# an override).
