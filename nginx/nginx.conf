user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;

    # Socket.io connections are long-lived HTTP requests before the upgrade
    # completes — without this map, "Connection: upgrade" wouldn't be sent
    # correctly for every request type.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Applied per-location in conf.d — scoped narrowly to auth/synthesis so
    # normal browsing and the WebSocket connection are never throttled.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=synthesize_limit:10m rate=20r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
